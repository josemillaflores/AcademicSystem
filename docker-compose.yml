version: '3.8'

services:
  # ---------------------------------------------
  # INFRAESTRUCTURA
  # ---------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: academicsystem_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: academicsystem_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: academicsystem_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # MICROSERVICIOS
  # ---------------------------------------------
  studentservice:
    image: academicsystem/studentservice
    build:
      context: .
      dockerfile: src/Services/StudentService/StudentService.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=StudentDb;Username=postgres;Password=password123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  courseservice:
    image: academicsystem/courseservice
    build:
      context: .
      dockerfile: src/Services/CourseService/CourseService.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=CourseDb;Username=postgres;Password=password123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  enrollmentservice:
    image: academicsystem/enrollmentservice
    build:
      context: .
      dockerfile: src/Services/EnrollmentService/EnrollmentService.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=EnrollmentDb;Username=postgres;Password=password123
      - Services__StudentService=http://studentservice:80
      - Services__CourseService=http://courseservice:80
      - Services__PaymentService=http://paymentservice:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------
  # API GATEWAY (YARP)
  # ---------------------------------------------
  apigateway:
    image: academicsystem/apigateway
    build:
      context: .
      dockerfile: src/ApiGateway/AcademicSystem.ApiGateway/Dockerfile
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - studentservice
      - courseservice
      - enrollmentservice