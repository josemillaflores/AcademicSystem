version: '3.8'

networks:
  academic_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: academic_postgres
    environment:
      POSTGRES_DB: AcademicDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d AcademicDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: academic_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - academic_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  studentservice:
    build:
      context: ./src/Services/StudentService
      dockerfile: StudentService.API/Dockerfile
    container_name: academic_studentservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=StudentDb;Username=admin;Password=Admin123!
      - EventBus__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - academic_network
    ports:
      - "5001:8080"
      - "5006:8081"

  teacherservice:
    build:
      context: ./src/Services/TeacherService
      dockerfile: TeacherService.API/Dockerfile
    container_name: academic_teacherservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=TeacherDb;Username=admin;Password=Admin123!
      - EventBus__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academic_network
    ports:
      - "5002:8080"
      - "5007:8081"

  courseservice:
    build:
      context: ./src/Services/CourseService
      dockerfile: CourseService.API/Dockerfile
    container_name: academic_courseservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=CourseDb;Username=admin;Password=Admin123!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academic_network
    ports:
      - "5003:8080"
      - "5008:8081"

  enrollmentservice:
    build:
      context: ./src/Services/EnrollmentService
      dockerfile: EnrollmentService.API/Dockerfile
    container_name: academic_enrollmentservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=EnrollmentDb;Username=admin;Password=Admin123!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academic_network
    ports:
      - "5004:8080"
      - "5009:8081"

  paymentservice:
    build:
      context: ./src/Services/PaymentService
      dockerfile: PaymentService.API/Dockerfile
    container_name: academic_paymentservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=PaymentDb;Username=admin;Password=Admin123!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academic_network
    ports:
      - "5005:8080"
      - "5010:8081"

  apigateway:
    build:
      context: ./src/ApiGateway/AcademicSystem.ApiGateway
      dockerfile: Dockerfile
    container_name: academic_apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - Auth__SecretKey=your-super-secret-key-with-at-least-32-characters-long
      - Auth__Issuer=academic_auth
      - Auth__Audience=academic_api
    depends_on:
      - studentservice
      - teacherservice
      - courseservice
      - enrollmentservice
      - paymentservice
    networks:
      - academic_network
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3