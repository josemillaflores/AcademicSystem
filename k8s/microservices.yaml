# Enrollment Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollmentservice
  namespace: academic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrollmentservice
  template:
    metadata:
      labels:
        app: enrollmentservice
    spec:
      containers:
      - name: enrollmentservice
        image: academicsystem/enrollmentservice:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ConnectionStrings__EnrollmentConnection
        - name: RabbitMQ__HostName
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RabbitMQ__HostName
        # Comunicación Sincrónica entre Microservicios (Mapeado en K8s)
        - name: Services__StudentService
          value: "http://studentservice-service:80"
        - name: Services__CourseService
          value: "http://courseservice-service:80"
        - name: Services__PaymentService
          value: "http://paymentservice-service:80"
---
apiVersion: v1
kind: Service
metadata:
  name: enrollmentservice-service
  namespace: academic-system
spec:
  selector:
    app: enrollmentservice
  ports:
  - port: 80
    targetPort: 8080
---
