# Student Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentservice
  namespace: academic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentservice
  template:
    metadata:
      labels:
        app: studentservice
    spec:
      containers:
      - name: studentservice
        image: academicsystem/studentservice:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ConnectionStrings__StudentConnection
---
apiVersion: v1
kind: Service
metadata:
  name: studentservice-service
  namespace: academic-system
spec:
  selector:
    app: studentservice
  ports:
  - port: 80
    targetPort: 8080
---
