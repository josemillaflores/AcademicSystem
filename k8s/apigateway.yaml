apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: academic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: academicsystem/apigateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        # Mapeo de clústeres YARP a los servicios internos de K8s (Puerto 80 de los Services)
        - name: ReverseProxy__Clusters__students-cluster__Destinations__destination1__Address
          value: "http://studentservice-service:80/"
        - name: ReverseProxy__Clusters__courses-cluster__Destinations__destination1__Address
          value: "http://courseservice-service:80/"
        - name: ReverseProxy__Clusters__enrollments-cluster__Destinations__destination1__Address
          value: "http://enrollmentservice-service:80/"
        - name: ReverseProxy__Clusters__payments-cluster__Destinations__destination1__Address
          value: "http://paymentservice-service:80/"
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: academic-system
spec:
  type: LoadBalancer
  selector:
    app: apigateway
  ports:
  - port: 80
    targetPort: 8080
